  <script>
    // 1. Automatically pre-fill the form fields if they are sent in the website URL link
    window.addEventListener('DOMContentLoaded', () => {
      const urlParams = new URLSearchParams(window.location.search);
      const refParam = urlParams.get('ref') || urlParams.get('bookingref');
      const nameParam = urlParams.get('name') || urlParams.get('fullname');
      
      if (refParam) document.getElementById('bookingRef').value = refParam.toUpperCase();
      if (nameParam) document.getElementById('fullName').value = decodeURIComponent(nameParam);
    });

    // 2. Change the appearance of the boxes to green when a file is selected
    document.getElementById('licenceInput').addEventListener('change', function() {
      if(this.files.length) {
        document.getElementById('licenceEmpty').classList.add('hidden');
        document.getElementById('licenceFilled').classList.remove('hidden');
      }
    });
    document.getElementById('proofInput').addEventListener('change', function() {
      if(this.files.length) {
        document.getElementById('proofEmpty').classList.add('hidden');
        document.getElementById('proofFilled').classList.remove('hidden');
      }
    });

    // 3. Submits data directly to your free Google Drive/Sheet database
    document.getElementById('checkinForm').addEventListener('submit', function(e) {
      e.preventDefault();
      
      const submitBtn = e.target.querySelector('.btn-submit');
      submitBtn.textContent = "Uploading Documents... Please Wait...";
      submitBtn.disabled = true;

      const licenceFile = document.getElementById('licenceInput').files[0];
      const proofFile = document.getElementById('proofInput').files[0];

      // Convert image files into text strings so Google Sheets can handle them safely
      const getBase64 = (file) => new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.readAsDataURL(file);
        reader.onload = () => {
          resolve({
            base64: reader.result.split(',')[1],
            name: file.name,
            type: file.type
          });
        };
        reader.onerror = error => reject(error);
      });

      Promise.all([getBase64(licenceFile), getBase64(proofFile)]).then(files => {
        const payload = {
          bookingRef: document.getElementById('bookingRef').value.toUpperCase(),
          fullName: document.getElementById('fullName').value,
          address: document.getElementById('address').value,
          licenceFile: files[0],
          proofFile: files[1]
        };

        // Linked to your live Google Script URL
        const GOOGLE_SCRIPT_URL = "https://google.com";

        fetch(GOOGLE_SCRIPT_URL, {
          method: 'POST',
          mode: 'no-cors', // Bypasses security restrictions cleanly on phones
          body: JSON.stringify(payload)
        }).then(() => {
          // Switch form out to reveal the success panel layout
          document.getElementById('checkinForm').classList.add('hidden');
          document.getElementById('confirmedName').textContent = payload.fullName;
          document.getElementById('confirmedBookingRef').textContent = payload.bookingRef;
          document.getElementById('successPanel').classList.remove('hidden');
          window.scrollTo(0, 0);
        }).catch(err => {
          alert("Submission error, please try again or refresh the page.");
          submitBtn.textContent = "Submit Pre-Arrival Check-in";
          submitBtn.disabled = false;
        });
      });
    });
  </script>
</body>
</html>
